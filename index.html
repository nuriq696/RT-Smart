                        const CACHE_NAME = 'rt-smart-v1';
                        self.addEventListener('install', event => self.skipWaiting());

                        self.addEventListener('fetch', event => {

                        });
                    `;

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="fas fa-check-circle text-green-500"></i>' : 
                         type === 'error' ? '<i class="fas fa-exclamation-circle text-red-500"></i>' : 
                         '<i class="fas fa-info-circle text-blue-500"></i>';
            const borderColor = type === 'success' ? 'border-green-100' : type === 'error' ? 'border-red-100' : 'border-blue-100';
            const barColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            
            toast.className = `toast-enter flex items-center gap-3 bg-white border ${borderColor} shadow-xl rounded-xl p-4 min-w-[250px] max-w-sm pointer-events-auto relative overflow-hidden`;
            const progress = `<div class="absolute bottom-0 left-0 h-1 ${barColor} animate-[shrink_3s_linear_forwards]" style="width: 100%;"></div>`;
            
            toast.innerHTML = `
                <div class="text-2xl">${icon}</div>
                <div class="flex-1 text-sm font-medium text-gray-700">${message}</div>
                <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                <style>@keyframes shrink { from { width: 100%; } to { width: 0%; } }</style>
                ${progress}
            `;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

                } else {

            }

                                res.data = { totalWarga: wData.length, totalKk: kks.size, saldoKas: saldo, suratPending: pending, totalKontrak };
                                break;
                            case 'getWarga': res.data = dbWarga; break;
                            case 'addWarga': 
                                payload.data.id = payload.data.id || 'W' + Date.now();
                                dbWarga.push(payload.data); 
                                // Auto-buat akun login untuk warga baru
                                dbUsers.push({
                                    id: 'U' + Date.now(),
                                    username: payload.data.namaLengkap,
                                    password: "rt02oke",
                                    role: "warga",
                                    noRumah: payload.data.noRumah,
                                    nama: payload.data.namaLengkap
                                });
                                break;
                            case 'updateWarga':
                                const wIdx = dbWarga.findIndex(w => w.id === payload.id);
                                if(wIdx !== -1) {
                                    dbWarga[wIdx] = { ...dbWarga[wIdx], ...payload.data };
                                    // Sinkronisasi update nama/rumah ke akun login
                                    const userIdx = dbUsers.findIndex(u => u.nama === dbWarga[wIdx].namaLengkap);
                                    if(userIdx !== -1) {
                                        dbUsers[userIdx].username = payload.data.namaLengkap;
                                        dbUsers[userIdx].nama = payload.data.namaLengkap;
                                        dbUsers[userIdx].noRumah = payload.data.noRumah;
                                    }
                                }
                                break;
                            case 'getKeuangan': res.data = dbKeuangan; break;
                            case 'addKeuangan': dbKeuangan.push(payload.data); break;
                            case 'getPengumuman': res.data = dbPengumuman; break;
                            case 'addPengumuman': dbPengumuman.push(payload.data); break;
                            case 'getSurat':
                                res.data = currentUser.role === 'warga' ? dbSurat.filter(s => s.noRumah === currentUser.noRumah) : dbSurat;
                                break;
                            case 'addSurat': dbSurat.push(payload.data); break;
                            case 'updateSuratStatus':
                                const surat = dbSurat.find(s => s.id === payload.id);
                                if(surat) surat.status = payload.status;
                                break;
                            case 'getPinjaman': res.data = dbPinjaman; break;
                            case 'addPinjaman': dbPinjaman.push(payload.data); break;
                            case 'getInventaris': res.data = dbInventaris; break;
                            case 'addInventaris': dbInventaris.push(payload.data); break;
                            case 'updateInventaris':
                                const invIdx = dbInventaris.findIndex(x => x.id === payload.id);
                                if(invIdx !== -1) dbInventaris[invIdx] = { ...dbInventaris[invIdx], ...payload.data };
                                break;
                            case 'deleteInventaris':
                                dbInventaris = dbInventaris.filter(x => x.id !== payload.id);
                                break;
                            case 'getSlider': res.data = dbSlider; break;
                            case 'addSlide':
                                payload.data.id = 'SL' + Date.now();
                                dbSlider.push(payload.data);
                                break;
                            case 'deleteSlide':
                                dbSlider = dbSlider.filter(s => s.id !== payload.id);
                                break;
                            case 'updateProfile':
                                const userToUpdate = dbUsers.find(u => u.id === payload.id);
                                if (userToUpdate) {
                                    if(payload.username) userToUpdate.username = payload.username;
                                    if(payload.password) userToUpdate.password = payload.password;
                                }
                                currentUser.username = payload.username || currentUser.username;
                                currentUser.password = payload.password || currentUser.password;
                                break;
                        }
                        resolve(res);
                    }, 300); 
                });
            } else {
                // LOGIKA FIREBASE ASLI
                let res = { success: true, data: null, message: "" };
                try {
                    const getCol = async (colName) => {
                        const snap = await db.collection(colName).get();
                        return snap.docs.map(d => ({id: d.id, ...d.data()}));
                    };

                    switch(action) {
                        case 'login':
                            let users = await getCol('Users');
                            
                            // SEED DATA JIKA KOSONG (Hanya dijalankan sekali saat database Firebase masih baru)
                            if(users.length === 0) {
                                console.log("Menyiapkan database Firebase perdana...");
                                const collectionsToSeed = {
                                    'Users': dbUsers, 'Warga': dbWarga, 'Keuangan': dbKeuangan, 
                                    'Pengumuman': dbPengumuman, 'Surat': dbSurat, 'Slider': dbSlider, 
                                    'Pinjaman': dbPinjaman, 'Inventaris': dbInventaris
                                };
                                for (const [colName, items] of Object.entries(collectionsToSeed)) {
                                    for (const item of items) {
                                        await db.collection(colName).doc(item.id).set(item);
                                    }
                                }
                                users = await getCol('Users'); // Ambil ulang setelah disemai
                            }

                            const user = users.find(u => u.username === payload.username && u.password === payload.password);
                            if(user) { res.data = user; res.message = "Login Berhasil"; }
                            else { res.success = false; res.message = "Username/Password Salah!"; }
                            break;
                            
                        case 'getDashboardStats':
                            let wData = await getCol('Warga');
                            let kData = await getCol('Keuangan');
                            let sData = await getCol('Surat');
                            let kks = new Set(wData.map(w => w.noKk));
                            let totalKontrak = wData.filter(w => w.statusTinggal === 'Kontrak').length;
                            let saldo = kData.reduce((sum, item) => item.jenis === 'Pemasukan' ? sum + Number(item.nominal) : sum - Number(item.nominal), 0);
                            let pending = sData.filter(s => s.status === 'Menunggu').length;
                            res.data = { totalWarga: wData.length, totalKk: kks.size, saldoKas: saldo, suratPending: pending, totalKontrak };
                            break;
                            
                        case 'getWarga': res.data = await getCol('Warga'); break;
                        case 'addWarga':
                            payload.data.id = payload.data.id || 'W' + Date.now();
                            await db.collection('Warga').doc(payload.data.id).set(payload.data);
                            // Auto-buat akun login di Firebase
                            const newUserId = 'U' + Date.now();
                            await db.collection('Users').doc(newUserId).set({
                                id: newUserId,
                                username: payload.data.namaLengkap,
                                password: "rt02oke",
                                role: "warga",
                                noRumah: payload.data.noRumah,
                                nama: payload.data.namaLengkap
                            });
                            break;
                        case 'updateWarga':
                            await db.collection('Warga').doc(payload.id).update(payload.data);
                            // Sinkronisasi update nama/rumah ke akun login Firebase
                            const usersToUpdate = await db.collection('Users').where('nama', '==', payload.data.namaLengkap).get();
                            if(!usersToUpdate.empty) {
                                const userDoc = usersToUpdate.docs[0];
                                await db.collection('Users').doc(userDoc.id).update({
                                    username: payload.data.namaLengkap,
                                    nama: payload.data.namaLengkap,
                                    noRumah: payload.data.noRumah
                                });
                            }
                            break;
                            
                        case 'getKeuangan': res.data = await getCol('Keuangan'); break;
                        case 'addKeuangan':
                            payload.data.id = payload.data.id || 'K' + Date.now();
                            await db.collection('Keuangan').doc(payload.data.id).set(payload.data);
                            break;
                            
                        case 'getPengumuman': res.data = await getCol('Pengumuman'); break;
                        case 'addPengumuman': 
                            payload.data.id = payload.data.id || 'P' + Date.now();
                            await db.collection('Pengumuman').doc(payload.data.id).set(payload.data);
                            break;
                            
                        case 'getSurat':
                            const suratAll = await getCol('Surat');
                            res.data = currentUser.role === 'warga' ? suratAll.filter(s => s.noRumah === currentUser.noRumah) : suratAll;
                            break;
                        case 'addSurat': 
                            payload.data.id = payload.data.id || 'S' + Date.now();
                            await db.collection('Surat').doc(payload.data.id).set(payload.data);
                            break;
                        case 'updateSuratStatus':
                            await db.collection('Surat').doc(payload.id).update({ status: payload.status });
                            break;
                            
                        case 'getPinjaman': res.data = await getCol('Pinjaman'); break;
                        case 'addPinjaman': 
                            payload.data.id = payload.data.id || 'PJ' + Date.now();
                            await db.collection('Pinjaman').doc(payload.data.id).set(payload.data);
                            break;
                            
                        case 'getInventaris': res.data = await getCol('Inventaris'); break;
                        case 'addInventaris': 
                            payload.data.id = payload.data.id || 'INV' + Date.now();
                            await db.collection('Inventaris').doc(payload.data.id).set(payload.data);
                            break;
                        case 'updateInventaris':
                            await db.collection('Inventaris').doc(payload.id).update(payload.data);
                            break;
                        case 'deleteInventaris':
                            await db.collection('Inventaris').doc(payload.id).delete();
                            break;
                            
                        case 'getSlider': res.data = await getCol('Slider'); break;
                        case 'addSlide':
                            payload.data.id = 'SL' + Date.now();
                            payload.data.url = payload.data.url || payload.data.base64; 
                            await db.collection('Slider').doc(payload.data.id).set(payload.data);
                            break;
                        case 'deleteSlide':
                            await db.collection('Slider').doc(payload.id).delete();
                            break;
                            
                        case 'updateProfile':
                            let updateObj = {};
                            if(payload.username) updateObj.username = payload.username;
                            if(payload.password) updateObj.password = payload.password;
                            await db.collection('Users').doc(payload.id).update(updateObj);
                            currentUser.username = payload.username || currentUser.username;
                            currentUser.password = payload.password || currentUser.password;
                            break;
                    }
                } catch (err) {
                    res.success = false;
                    res.message = err.message;
                }
                return res;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span class="ml-2">Memeriksa...</span>';
            btn.disabled = true;

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const res = await fetchApp('login', { username: user, password: pass });

            if (res.success) {
                currentUser = res.data;
                document.getElementById('user-name').innerText = currentUser.nama;
                document.getElementById('user-house').innerText = currentUser.role === 'admin' ? "Ketua RT / Pengurus" : `Blok ${currentUser.noRumah}`;
                document.getElementById('user-role-badge').innerText = currentUser.role;
                document.getElementById('user-initial').innerText = currentUser.nama.charAt(0).toUpperCase();
                
                buildMenu();
                
                loginScreen.classList.add('hidden');
                appLayout.classList.remove('hidden');
                
                if(currentUser.role === 'admin') loadMenu('dashboard');
                else loadMenu('beranda');
                
                showToast(`Selamat datang, ${currentUser.nama}!`, 'success');
            } else {
                showToast(res.message, 'error');
            }
            btn.innerHTML = '<span>Masuk ke Sistem</span> <i class="fas fa-arrow-right ml-2 text-sm"></i>';
            btn.disabled = false;
        }

        function logout() {
            currentUser = null;

            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            if(window.slideInterval) clearInterval(window.slideInterval);

        async function loadMenu(menuId) {
            if(window.slideInterval) clearInterval(window.slideInterval);

            document.querySelectorAll('#menu-container a').forEach(el => {
                el.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'border', 'border-indigo-500');
                el.classList.add('text-indigo-200');
                el.querySelector('i').classList.replace('text-white', 'text-indigo-300');
            });
            const activeEl = document.getElementById(`menu-${menuId}`);
            if(activeEl) {
                activeEl.classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'border', 'border-indigo-500');
                activeEl.classList.remove('text-indigo-200', 'hover:bg-white/10');
                activeEl.querySelector('i').classList.replace('text-indigo-300', 'text-white');
            }

            if(window.innerWidth < 768) toggleSidebar(); 

            contentArea.innerHTML = `<div class="flex flex-col h-full items-center justify-center text-gray-400 space-y-3"><i class="fas fa-circle-notch fa-spin text-4xl text-blue-500"></i><p class="font-medium text-sm">Memuat data...</p></div>`;

            try {
                if (menuId === 'dashboard') await renderDashboard();
                else if (menuId === 'beranda') await renderBeranda();
                else if (menuId === 'warga') await renderWarga();
                else if (menuId === 'keuangan') await renderKeuangan();
                else if (menuId === 'pinjaman') await renderPinjaman();
                else if (menuId === 'inventaris') await renderInventaris();
                else if (menuId === 'pengumuman') await renderPengumuman();
                else if (menuId === 'kritik') await renderKritik();
                else if (menuId === 'setting') await renderSetting();

                contentArea.innerHTML = `<div class="text-center text-red-500 p-8"><i class="fas fa-exclamation-triangle text-4xl mb-3"></i><p>Gagal memuat halaman: ${err.message}</p></div>`;

        }

        window.moveSlide = function(dir) {
            const track = document.getElementById('slider-track');
            if (!track) {
                if(window.slideInterval) clearInterval(window.slideInterval);
                return;
            }
            window.currentSlideIdx = (window.currentSlideIdx + dir + window.totalSlides) % window.totalSlides;
            track.style.transform = `translateX(-${window.currentSlideIdx * 100}%)`;
        };

                statusKeluarga: document.getElementById('w_status').value,
                statusTinggal: document.getElementById('w_tinggal').value,
                noHp: document.getElementById('w_hp').value

            const actionName = id ? 'updateWarga' : 'addWarga';
            const res = await fetchApp(actionName, { id: id, data: payload });

            document.getElementById('inv_ket').value = '';
            document.getElementById('form_title_inventaris').innerHTML = '<i class="fas fa-boxes text-indigo-500 mr-2"></i>Tambah Barang Baru';
            document.getElementById('btn-save-inventaris').innerHTML = "Simpan Barang";
            document.getElementById('modal-inventaris').classList.remove('hidden');
        }

        function editInventaris(id) {
            const item = window.inventarisList.find(x => x.id === id);
            if(!item) return;
            document.getElementById('inv_id').value = item.id; document.getElementById('inv_kode').value = item.kodeBarang;
            document.getElementById('inv_tanggal').value = item.tanggalBeli || ''; document.getElementById('inv_nama').value = item.namaBarang;
            document.getElementById('inv_jumlah').value = item.jumlah; document.getElementById('inv_kondisi').value = item.kondisi;
            document.getElementById('inv_lokasi').value = item.lokasi; document.getElementById('inv_ket').value = item.keterangan || '';
            document.getElementById('form_title_inventaris').innerHTML = '<i class="fas fa-edit text-indigo-500 mr-2"></i>Edit Data Inventaris';
            document.getElementById('btn-save-inventaris').innerHTML = "Simpan Perubahan";
            document.getElementById('modal-inventaris').classList.remove('hidden');
        }

        async function submitInventaris(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-inventaris');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Menyimpan...'; btn.disabled = true;
            const id = document.getElementById('inv_id').value;
            const payload = { kodeBarang: document.getElementById('inv_kode').value, tanggalBeli: document.getElementById('inv_tanggal').value, namaBarang: document.getElementById('inv_nama').value, jumlah: document.getElementById('inv_jumlah').value, kondisi: document.getElementById('inv_kondisi').value, lokasi: document.getElementById('inv_lokasi').value, keterangan: document.getElementById('inv_ket').value };
            const res = await fetchApp(id ? 'updateInventaris' : 'addInventaris', { id: id, data: payload });
            if (res.success) { showToast("Inventaris disimpan!", "success"); loadMenu('inventaris'); } 
            else { showToast(res.message, 'error'); btn.innerHTML = "Simpan Barang"; btn.disabled = false; }
        }

        function deleteInventaris(id) {
            if(confirm("Yakin hapus barang ini?")) {
                fetchApp('deleteInventaris', { id: id }).then(res => {
                    if (res.success) { showToast("Barang dihapus!"); loadMenu('inventaris'); }
                });
            }
        }

                    if (item.jenis === 'Pinjaman') totalPinjam += Number(item.nominal);

                                </div>

                            <div class="bg-black/20 backdrop-blur-sm p-4 grid grid-cols-2 divide-x divide-white/10 relative z-10">

                if (!summaryMap[key]) summaryMap[key] = { nama: item.namaPeminjam, noRumah: item.noRumah, keyIndex: key, totalPinjam: 0, totalAngsur: 0, riwayat: [] };
                
                summaryMap[key].riwayat.push(item);

            if(!val) {
                document.getElementById('pj_nama').value = '';
                document.getElementById('pj_rumah').value = '';
                return;
            }
            const parts = val.split('|');
            document.getElementById('pj_nama').value = parts[0];
            document.getElementById('pj_rumah').value = parts[1];
        };
        
        function viewDetailPeminjam(nama, noRumah) {
            const rawData = window.pinjamanDataGlobal.filter(p => p.namaPeminjam === nama && p.noRumah === noRumah);
            window.activePeminjam = { nama, noRumah };
            let tbodyHtml = '';
            rawData.reverse().forEach(p => { tbodyHtml += `<tr class="hover:bg-gray-50"><td class="p-3"><div class="font-bold text-xs">${p.tanggal}</div><span class="text-[9px] font-bold uppercase">${p.jenis}</span></td><td class="p-3 text-xs">${p.keterangan}</td><td class="p-3 text-right font-bold">${formatRp(p.nominal)}</td></tr>`; });
            document.getElementById('detail_title_nama').innerText = `${nama} (Blok ${noRumah})`;
            document.getElementById('detail_tbody').innerHTML = tbodyHtml;
            document.getElementById('modal-detail-peminjam').classList.remove('hidden');

            document.getElementById('pj_tanggal').value = new Date().toISOString().split('T')[0]; 
            document.getElementById('pj_nama').value = window.activePeminjam.nama; 
            document.getElementById('pj_rumah').value = window.activePeminjam.noRumah; 
            document.getElementById('pj_nominal').value = ''; 
            document.getElementById('pj_ket').value = '';
            document.getElementById('pj_jenis').value = jenisTransaksi;
            
            document.getElementById('div_pilih_warga').classList.add('hidden');
            document.getElementById('form_title_transaksi').innerText = jenisTransaksi;
            
            const btnSave = document.getElementById('btn-save-pinjaman');
            if(jenisTransaksi === 'Angsuran') {
                btnSave.className = "w-full bg-emerald-600 text-white font-bold py-3 rounded-xl mt-2";
            } else {
                btnSave.className = "w-full bg-rose-600 text-white font-bold py-3 rounded-xl mt-2";
            }

            document.getElementById('modal-detail-peminjam').classList.add('hidden'); 
            document.getElementById('modal-pinjaman').classList.remove('hidden');
        }

        async function submitPinjaman(e) {
            e.preventDefault();
            const payload = { tanggal: document.getElementById('pj_tanggal').value, namaPeminjam: document.getElementById('pj_nama').value, noRumah: document.getElementById('pj_rumah').value, jenis: document.getElementById('pj_jenis').value, nominal: document.getElementById('pj_nominal').value, keterangan: document.getElementById('pj_ket').value };
            await fetchApp('addPinjaman', { data: payload }); showToast("Disimpan"); loadMenu('pinjaman');
        }

        async function renderPengumuman() {
            pageTitle.innerText = "Pengumuman Warga";
            const data = (await fetchApp('getPengumuman')).data || [];
            let html = `<div class="fade-in">${currentUser.role === 'admin' ? `<div class="mb-6 flex justify-end"><button onclick="document.getElementById('modal-pengumuman').classList.remove('hidden')" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold">Buat Pengumuman</button></div>` : ''}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">${data.map(p => `<div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><div class="text-xs text-blue-600 font-bold mb-2">${p.tanggal}</div><h3 class="text-xl font-bold mb-2">${p.judul}</h3><p class="text-sm text-gray-600 mb-4">${p.isiPengumuman}</p><div class="text-xs text-gray-400">Oleh: ${p.pembuat}</div></div>`).join('')}</div></div>
                <div id="modal-pengumuman" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[9999] flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-lg"><form onsubmit="submitPengumuman(event)" class="space-y-4"><input type="date" id="p_tanggal" required class="w-full p-3 border rounded-xl"><input type="text" id="p_judul" required placeholder="Judul" class="w-full p-3 border rounded-xl"><textarea id="p_isi" required rows="5" placeholder="Isi" class="w-full p-3 border rounded-xl"></textarea><button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Siarkan</button></form></div></div>`;
            contentArea.innerHTML = html;
        }

        async function submitPengumuman(e) {
            e.preventDefault();
            const payload = { tanggal: document.getElementById('p_tanggal').value, judul: document.getElementById('p_judul').value, isiPengumuman: document.getElementById('p_isi').value, pembuat: currentUser.nama };
            await fetchApp('addPengumuman', { data: payload }); showToast("Disiarkan"); loadMenu('pengumuman');
        }

        async function renderKritik() {
            pageTitle.innerText = "Kritik & Saran";
            const data = (await fetchApp('getSurat')).data || [];
            let html = `<div class="fade-in font-sans">`;
            if (currentUser.role === 'warga') {
                html += `<div class="bg-blue-600 rounded-2xl p-6 text-white mb-8"><h3 class="text-xl font-bold mb-4">Kirim Pesan</h3><form onsubmit="submitSurat(event)" class="bg-white rounded-xl p-5 text-gray-800 space-y-4"><select id="s_jenis" class="w-full p-3 border rounded-lg"><option value="Laporan">Laporan / Keluhan</option><option value="Kritik">Kritik</option><option value="Saran">Saran</option></select><textarea id="s_keperluan" required rows="4" placeholder="Detail Pesan" class="w-full p-3 border rounded-lg"></textarea><button type="submit" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg">Kirim</button></form></div>`;
            }
            html += `<div class="bg-white rounded-2xl shadow-sm border p-5"><h3 class="font-bold mb-4">Riwayat Pesan</h3><div class="space-y-3">${data.reverse().map(s => `<div class="p-4 border rounded-xl"><div class="font-bold text-sm">${s.pemohon} (${s.noRumah}) - ${s.jenisSurat}</div><div class="text-xs text-gray-500 mb-2">${s.tanggal}</div><p class="text-sm">${s.keperluan}</p><div class="mt-2 font-bold text-xs ${s.status==='Selesai'?'text-green-600':s.status==='Dibaca'?'text-blue-600':'text-red-500'}">${s.status}</div>${currentUser.role==='admin' && s.status!=='Selesai' ? `<button onclick="updateSurat('${s.id}', 'Dibaca')" class="mr-2 text-blue-600 text-xs">Tandai Dibaca</button><button onclick="updateSurat('${s.id}', 'Selesai')" class="text-green-600 text-xs">Selesai</button>`:''}</div>`).join('')}</div></div></div>`;
            contentArea.innerHTML = html;
        }

        async function submitSurat(e) {
            e.preventDefault();
            const payload = { tanggal: new Date().toISOString().split('T')[0], noRumah: currentUser.noRumah, pemohon: currentUser.nama, jenisSurat: document.getElementById('s_jenis').value, keperluan: document.getElementById('s_keperluan').value, status: 'Menunggu' };
            await fetchApp('addSurat', { data: payload }); showToast("Terkirim"); loadMenu('kritik');
        }

        async function updateSurat(id, status) {
            await fetchApp('updateSuratStatus', { id, status }); loadMenu('kritik');
        }

        async function renderSetting() {
            pageTitle.innerText = "Pengaturan Akun";
            let slides = currentUser.role === 'admin' ? (await fetchApp('getSlider')).data || [] : [];

            let html = `
                <div class="fade-in font-sans max-w-2xl mx-auto space-y-6">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
                        <div class="flex items-center gap-4 mb-8 pb-6 border-b border-gray-100">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center text-white text-2xl font-bold shadow-lg">${currentUser.nama.charAt(0).toUpperCase()}</div>
                            <div><h3 class="text-xl font-bold text-gray-800">${currentUser.nama}</h3><p class="text-sm text-gray-500">Blok: ${currentUser.noRumah} • ${currentUser.role}</p></div>
                        </div>

                        <form onsubmit="handleUpdateSetting(event)" class="space-y-5">
                            <div><label class="block text-xs font-bold text-gray-600 uppercase mb-2">Username</label><input type="text" id="set_username" required value="${currentUser.username}" class="w-full p-3 bg-gray-50 border rounded-xl text-sm"></div>
                            <div><label class="block text-xs font-bold text-gray-600 uppercase mb-2">Password Baru</label><input type="password" id="set_password" placeholder="Kosongkan jika tidak ganti" class="w-full p-3 bg-gray-50 border rounded-xl text-sm"></div>
                            <button type="submit" id="btn-save-setting" class="bg-indigo-600 text-white font-bold py-3 px-8 rounded-xl">Simpan Perubahan</button>
                        </form>
                    </div>

                    ${currentUser.role === 'admin' ? `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
                        <h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center"><i class="fas fa-images text-indigo-500 mr-2"></i>Pengaturan Gambar Slide</h3>
                        
                        <form onsubmit="handleUploadCustomSlide(event)" class="space-y-4 mb-8 p-5 border border-indigo-50 rounded-xl bg-indigo-50/30">
                            <h4 class="text-sm font-bold text-indigo-800 mb-2"><i class="fas fa-upload mr-1"></i>Upload Gambar Slide Baru</h4>
                            
                            <div>
                                <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Pilih Gambar (Galeri HP / Komputer)</label>
                                <input type="file" id="slide_file" accept="image/jpeg, image/png, image/webp" required class="w-full p-2.5 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer transition">
                                <p class="text-[10px] text-gray-400 mt-1.5"><i class="fas fa-info-circle"></i> Ukuran gambar akan otomatis diperkecil agar aplikasi tetap ringan.</p>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Pitutur Jawa / Judul (Opsional)</label>
                                    <input type="text" id="slide_pitutur" placeholder="Cth: Urip Iku Urup" class="w-full p-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Arti / Sub-judul (Opsional)</label>
                                    <input type="text" id="slide_arti" placeholder="Cth: Hidup hendaknya memberi manfaat..." class="w-full p-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                                </div>
                            </div>
                            
                            <div class="flex justify-end pt-2">
                                <button type="submit" id="btn-add-slide" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-md transition text-sm flex items-center justify-center">
                                    <i class="fas fa-cloud-upload-alt mr-2"></i>Upload Slide
                                </button>
                            </div>
                        </form>

                        <h4 class="text-sm font-bold text-gray-700 mb-4"><i class="fas fa-list-ul mr-1"></i>Daftar Slide Aktif</h4>
                        <div class="space-y-3">
                            ${slides.length === 0 ? '<p class="text-sm text-gray-500 italic p-4 text-center border rounded-xl bg-gray-50">Belum ada gambar slide.</p>' : slides.map(s => `
                                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-3 border border-gray-200 rounded-xl bg-white gap-3 hover:shadow-sm transition-shadow">
                                    <div class="flex items-center gap-3 min-w-0 w-full">
                                        <div class="w-20 h-12 rounded-lg overflow-hidden bg-gray-100 flex-shrink-0 border border-gray-200">
                                            <img src="${s.url}" class="w-full h-full object-cover">
                                        </div>
                                        <div class="min-w-0 flex-1">
                                            <p class="text-xs font-bold text-gray-800 truncate">${s.filename || 'Gambar Upload'}</p>
                                            ${s.pitutur ? `<p class="text-[10px] text-indigo-600 font-semibold truncate italic mt-0.5">"${s.pitutur}"</p>` : ''}
                                        </div>
                                    </div>
                                    <button onclick="handleDeleteSlideSetting('${s.id}')" class="w-full sm:w-auto text-red-500 hover:text-red-700 hover:bg-red-50 py-1.5 px-3 rounded-lg border border-transparent hover:border-red-200 transition text-xs font-bold flex-shrink-0">
                                        Hapus
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>` : ''}
                </div>
            `;
            contentArea.innerHTML = html;
        }

        async function handleUploadCustomSlide(e) {
            e.preventDefault();
            const fileInput = document.getElementById('slide_file');
            const file = fileInput.files[0];
            if(!file) return;

            const btn = document.getElementById('btn-add-slide');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Mengunggah...';
            btn.disabled = true;

            const pitutur = document.getElementById('slide_pitutur').value || '';
            const arti = document.getElementById('slide_arti').value || '';

            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.src = URL.createObjectURL(file);
                await new Promise(res => img.onload = res);
                
                const MAX_WIDTH = 1000;
                let width = img.width;
                let height = img.height;
                
                if (width > MAX_WIDTH) {
                    height = Math.round((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }
                
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                const base64String = canvas.toDataURL('image/jpeg', 0.7);

                const payload = { filename: file.name, pitutur: pitutur, arti: arti, url: base64String };
                const res = await fetchApp('addSlide', { data: payload });
                
                if (res.success) { showToast("Slide diunggah!", "success"); loadMenu('setting'); } 
                else { showToast(res.message, "error"); btn.innerHTML = originalText; btn.disabled = false; }
            } catch (err) {
                showToast("Gagal memproses gambar.", "error");
                btn.innerHTML = originalText; btn.disabled = false;
            }
        }

        async function handleDeleteSlideSetting(id) {
            if(confirm("Hapus slide ini?")) {
                showToast("Menghapus...", "info");
                const res = await fetchApp('deleteSlide', { id: id });
                if (res.success) { showToast("Dihapus!", "success"); loadMenu('setting'); }
            }
        }

        async function handleUpdateSetting(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-setting');
            btn.innerHTML = 'Menyimpan...'; btn.disabled = true;
            const newUsername = document.getElementById('set_username').value;
            const newPassword = document.getElementById('set_password').value;
            const res = await fetchApp('updateProfile', { id: currentUser.id, username: newUsername, password: newPassword });
            if (res.success) {
                showToast("Profil diperbarui!");
                if(newPassword) setTimeout(() => { logout(); }, 1500); else loadMenu('setting');
            } else { showToast(res.message, 'error'); btn.innerHTML = 'Simpan Perubahan'; btn.disabled = false; }
        }

        window.handleUploadCustomSlide = handleUploadCustomSlide;
        window.handleDeleteSlideSetting = handleDeleteSlideSetting;
    </script>
</body>
</html>
