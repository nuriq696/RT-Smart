    <script>

        // ==========================================
        // INIT PWA (PROGRESSIVE WEB APP) VIRTUAL
        // ==========================================
        let deferredPrompt;
        
        function initPWA() {
            // 1. Buat Manifest JSON secara dinamis
            const manifest = {
                name: "Sistem Informasi Manajemen RT Smart",
                short_name: "RT Smart",
                description: "Aplikasi Manajemen Rukun Tetangga",
                start_url: window.location.href, // Akan selalu menyesuaikan URL Blogger Anda
                display: "standalone",
                background_color: "#f8fafc",
                theme_color: "#1e3a8a",
                icons: [
                    {
                        src: "https://cdn-icons-png.flaticon.com/512/2190/2190328.png",
                        sizes: "512x512",
                        type: "image/png",
                        purpose: "any maskable"
                    }
                ]
            };
            
            // Pasang Manifest ke Meta Link
            const manifestString = JSON.stringify(manifest);
            const encodedManifest = 'data:application/json;charset=utf-8,' + encodeURIComponent(manifestString);
            document.getElementById('manifest-link').setAttribute('href', encodedManifest);

            // 2. Buat dan Daftarkan Service Worker Virtual (Syarat wajib PWA)
            if ('serviceWorker' in navigator) {
                try {
                    const swCode = `
                        const CACHE_NAME = 'rt-smart-v1';
                        self.addEventListener('install', event => self.skipWaiting());
                        self.addEventListener('activate', event => event.waitUntil(clients.claim()));
                        self.addEventListener('fetch', event => {
                            // Lewati jaringan langsung (Blogger sudah menangani cache)
                            event.respondWith(fetch(event.request).catch(() => new Response("Offline Mode")));
                        });
                    `;
                    const blob = new Blob([swCode], { type: 'application/javascript' });
                    const swUrl = URL.createObjectURL(blob);
                    
                    // PERBAIKAN: Menambahkan .catch() untuk menangani penolakan (rejection)
                    // dari browser yang memblokir Blob URL untuk Service Worker
                    navigator.serviceWorker.register(swUrl)
                        .then(reg => {
                            console.log('PWA Service Worker siap.');
                        })
                        .catch(err => {
                            console.log('Info PWA: Service Worker Blob diblokir oleh sistem keamanan browser. Aplikasi tetap berjalan normal.', err.message);
                        });
                } catch (e) {
                    console.log("PWA gagal diinisiasi (mungkin karena mode iframe).", e);
                }
            }

            // 3. Tangkap event prompt instalasi dari browser
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                // Tampilkan tombol instal di layar login
                const installBtn = document.getElementById('btn-install-pwa');
                if (installBtn) installBtn.classList.remove('hidden');
            });
        }

                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Pengguna menginstal PWA RT Smart');
                        document.getElementById('btn-install-pwa').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        initPWA();
        // ==========================================

            { id: "W2", noKk: "33011223344", nik: "330112233440002", namaLengkap: "Siti Aminah", noRumah: "A-01", jenisKelamin: "Perempuan", tempatLahir: "Bandung", tanggalLahir: "1985-08-20", agama: "Islam", pekerjaan: "Mengurus Rumah Tangga", statusKeluarga: "Istri", statusTinggal: "Tetap", noHp: "08129876543" },
            { id: "W3", noKk: "33011223355", nik: "330112233550001", namaLengkap: "Andi Saputra", noRumah: "B-05", jenisKelamin: "Laki-laki", tempatLahir: "Semarang", tanggalLahir: "1995-02-15", agama: "Kristen", pekerjaan: "Wiraswasta", statusKeluarga: "Kepala Keluarga", statusTinggal: "Kontrak", noHp: "08561234567" },
            { id: "W4", noKk: "33011223344", nik: "330112233440003", namaLengkap: "Bagas Santoso", noRumah: "A-01", jenisKelamin: "Laki-laki", tempatLahir: "Jakarta", tanggalLahir: "2015-01-10", agama: "Islam", pekerjaan: "Pelajar/Mahasiswa", statusKeluarga: "Anak", statusTinggal: "Tetap", noHp: "" }

        // --- SISTEM TOAST (PENGGANTI ALERT) ---
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="fas fa-check-circle text-green-500"></i>' : 
                         type === 'error' ? '<i class="fas fa-exclamation-circle text-red-500"></i>' : 
                         '<i class="fas fa-info-circle text-blue-500"></i>';
            const bgColor = 'bg-white';
            const borderColor = type === 'success' ? 'border-green-100' : type === 'error' ? 'border-red-100' : 'border-blue-100';
            
            toast.className = `toast-enter flex items-center gap-3 ${bgColor} border ${borderColor} shadow-xl rounded-xl p-4 min-w-[250px] max-w-sm pointer-events-auto relative overflow-hidden`;
            
            // Progress bar
            const barColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            const progress = `<div class="absolute bottom-0 left-0 h-1 ${barColor} animate-[shrink_3s_linear_forwards]" style="width: 100%;"></div>`;
            
            toast.innerHTML = `
                <div class="text-2xl">${icon}</div>
                <div class="flex-1 text-sm font-medium text-gray-700">${message}</div>
                <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                <style>@keyframes shrink { from { width: 100%; } to { width: 0%; } }</style>
                ${progress}
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatRp(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // Fungsi Toggle Visibility Password (Mata)
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input && icon) {
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash"); // Ganti ikon mata tercoret
                } else {
                    input.type = "password";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye"); // Kembalikan ikon mata
                }
            }
        }

        // Fetch Wrapper (Menghubungkan Frontend ke Backend/Dummy)
        async function fetchApp(action, payload = {}) {
            if (IS_PREVIEW) {
                return new Promise(resolve => {
                    setTimeout(() => {
                        let res = { success: true, data: null, message: "" };
                        switch(action) {
                            case 'login':
                                const user = dbUsers.find(u => u.username === payload.username && u.password === payload.password);
                                if(user) { res.data = user; res.message = "Login Berhasil"; }
                                else { res.success = false; res.message = "Username/Password Salah!"; }
                                break;
                            case 'getDashboardStats':
                                let totalWarga = dbWarga.length;
                                let kks = new Set(dbWarga.map(w => w.noKk));
                                let totalKontrak = dbWarga.filter(w => w.statusTinggal === 'Kontrak').length;
                                let saldo = dbKeuangan.reduce((sum, item) => item.jenis === 'Pemasukan' ? sum + Number(item.nominal) : sum - Number(item.nominal), 0);
                                let pending = dbSurat.filter(s => s.status === 'Menunggu').length;
                                res.data = { totalWarga, totalKk: kks.size, saldoKas: saldo, suratPending: pending, totalKontrak };
                                break;
                            case 'getWarga': res.data = dbWarga; break;
                            case 'addWarga': dbWarga.push(payload.data); break;
                            case 'updateWarga':
                                const wIdx = dbWarga.findIndex(w => w.id === payload.id);
                                if(wIdx !== -1) dbWarga[wIdx] = { ...dbWarga[wIdx], ...payload.data };
                                break;
                            case 'getKeuangan': res.data = dbKeuangan; break;
                            case 'addKeuangan': dbKeuangan.push(payload.data); break;
                            case 'getPengumuman': res.data = dbPengumuman; break;
                            case 'addPengumuman': dbPengumuman.push(payload.data); break;
                            case 'getSurat':
                                res.data = currentUser.role === 'warga' ? dbSurat.filter(s => s.noRumah === currentUser.noRumah) : dbSurat;
                                break;
                            case 'addSurat': dbSurat.push(payload.data); break;
                            case 'updateSuratStatus':
                                const surat = dbSurat.find(s => s.id === payload.id);
                                if(surat) surat.status = payload.status;
                                break;
                            case 'getPinjaman': 
                                res.data = dbPinjaman; 
                                break;
                            case 'addPinjaman': 
                                dbPinjaman.push(payload.data); 
                                break;
                            case 'getSlider': res.data = dbSlider; break;
                            case 'addSlide':
                                // Mode Preview lokal: langsung pakai base64
                                payload.data.id = 'SL' + Date.now();
                                payload.data.url = payload.data.base64; 
                                dbSlider.push(payload.data);
                                break;
                            case 'deleteSlide':
                                dbSlider = dbSlider.filter(s => s.id !== payload.id);
                                break;
                            case 'updateProfile':
                                const userToUpdate = dbUsers.find(u => u.id === payload.id);
                                if (userToUpdate) {
                                    if(payload.username) userToUpdate.username = payload.username;
                                    if(payload.password) userToUpdate.password = payload.password;
                                }
                                // Update current user session var
                                currentUser.username = payload.username || currentUser.username;
                                currentUser.password = payload.password || currentUser.password;
                                break;
                        }
                        resolve(res);
                    }, 500); // Simulasi delay jaringan 500ms
                });
            } else {
                // LIVE FETCH KE GOOGLE APPS SCRIPT
                const options = {
                    method: 'POST',
                    body: JSON.stringify({ action: action, ...payload })
                };
                try {
                    const response = await fetch(GAS_URL, options);
                    const result = await response.json();
                    if (!result.success) throw new Error(result.message);
                    return result;
                } catch (error) {
                    return { success: false, message: error.message };
                }
            }
        }

        function moveSlide(dir) {

        async function handleUploadSlide(e) {
            e.preventDefault();
            const fileInput = document.getElementById('slide_file');
            const file = fileInput.files[0];
            if(!file) return;

            const btn = document.getElementById('btn-upload-slide');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Mengunggah...';
            btn.disabled = true;

            try {
                // Kompresi Gambar
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.src = URL.createObjectURL(file);
                await new Promise(res => img.onload = res);
                
                const MAX_WIDTH = 1200;
                let width = img.width;
                let height = img.height;
                if (width > MAX_WIDTH) {
                    height = Math.round((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                const base64String = canvas.toDataURL('image/jpeg', 0.8);

                const payload = {
                    filename: file.name,
                    mimeType: 'image/jpeg', // tetap dikirim untuk metadata
                    base64: base64String
                };

                const res = await fetchApp('addSlide', { data: payload });
                if (res.success) {
                    showToast("Gambar berhasil diunggah", "success");
                    // Muat ulang dashboard tanpa menutup modal agar terlihat hasilnya
                    await loadMenu(currentUser.role === 'admin' ? 'dashboard' : 'beranda');
                    document.getElementById('modal-slider').classList.remove('hidden');
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showToast("Gagal memproses gambar", 'error');
            }
            
            // Kembalikan tombol
            btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-2"></i>Upload';
            btn.disabled = false;
        }

            pageTitle.innerText = "Data Warga & Demografi";

            let usiaDewasaL = 0, usiaDewasaP = 0;
            let usiaLansiaL = 0, usiaLansiaP = 0;
            
            let kerjaCounts = {};

            const tahunIni = new Date().getFullYear();

            data.forEach(w => {
                kks.add(w.noKk);
                if (w.jenisKelamin === 'Laki-laki') totalL++; else totalP++;
                if (w.statusTinggal === 'Kontrak') totalKontrak++;

                // Hitung Pekerjaan
                if(w.pekerjaan) kerjaCounts[w.pekerjaan] = (kerjaCounts[w.pekerjaan] || 0) + 1;

                // Hitung Umur
                if(w.tanggalLahir) {
                    const thnLahir = new Date(w.tanggalLahir).getFullYear();
                    const umur = tahunIni - thnLahir;
                    const isLaki = w.jenisKelamin === 'Laki-laki';
                    
                    if (umur >= 0 && umur <= 5) { isLaki ? usiaBalitaL++ : usiaBalitaP++; }
                    else if (umur >= 6 && umur <= 11) { isLaki ? usiaAnakL++ : usiaAnakP++; }
                    else if (umur >= 12 && umur <= 25) { isLaki ? usiaRemajaL++ : usiaRemajaP++; }
                    else if (umur >= 26 && umur <= 55) { isLaki ? usiaDewasaL++ : usiaDewasaP++; }
                    else if (umur > 55) { isLaki ? usiaLansiaL++ : usiaLansiaP++; }

        function generateWargaRows(data) {
            if(data.length === 0) return `<tr><td colspan="6" class="p-8 text-center text-gray-500 italic">Belum ada data warga.</td></tr>`;
            return data.map(w => `
                <tr class="hover:bg-indigo-50/30 transition-colors group">
                    <td class="p-4 align-top"><div class="font-bold text-indigo-700 leading-snug">${w.noRumah}</div></td>

                    <td class="p-4 align-top font-semibold text-gray-800">${w.namaLengkap} <div class="text-[10px] text-gray-400 font-normal mt-0.5">${w.jenisKelamin} • ${w.pekerjaan || '-'}</div></td>
                    <td class="p-4 align-top">
                        <div class="text-xs text-gray-600 font-medium mb-1">${w.statusKeluarga}</div>
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${w.statusTinggal === 'Kontrak' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${w.statusTinggal === 'Kontrak' ? 'Pengontrak' : 'Tetap'}</span>
                    </td>
                    <td class="p-4 align-top text-gray-600">${w.noHp ? `<a href="https://wa.me/${w.noHp.replace(/^0/,'62')}" target="_blank" class="hover:text-green-500 transition"><i class="fab fa-whatsapp mr-1"></i>${w.noHp}</a>` : '-'}</td>
                    ${currentUser.role === 'admin' ? `
                    <td class="p-4 align-top text-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editWarga('${w.id}')" class="bg-white border border-blue-200 text-blue-600 hover:bg-blue-50 hover:border-blue-300 shadow-sm p-2 rounded-lg transition" title="Edit Data"><i class="fas fa-user-edit"></i> Edit</button>
                    </td>
                    ` : ''}
                </tr>
            `).join('');
        }

        function filterWarga() {
            const term = document.getElementById('search-warga').value.toLowerCase();
            const filtered = window.wargaList.filter(w => w.namaLengkap.toLowerCase().includes(term) || w.nik.includes(term));
            document.getElementById('warga-tbody').innerHTML = generateWargaRows(filtered);
        }

        function openModalTambahWarga() {
            document.getElementById('form-warga').reset();
            document.getElementById('w_id').value = '';
            document.getElementById('modal-warga-title').innerHTML = "Tambah Data Warga";
            document.getElementById('btn-save-warga').innerHTML = "Simpan Data";
            document.getElementById('modal-warga').classList.remove('hidden');
        }

        function editWarga(id) {
            const w = window.wargaList.find(x => x.id === id);
            if(!w) return;
            
            document.getElementById('w_id').value = w.id;
            document.getElementById('w_kk').value = w.noKk;
            document.getElementById('w_nik').value = w.nik;
            document.getElementById('w_nama').value = w.namaLengkap;
            document.getElementById('w_rumah').value = w.noRumah;
            document.getElementById('w_jk').value = w.jenisKelamin;
            document.getElementById('w_tempatLahir').value = w.tempatLahir;
            // Potong datetime ISO agar pas masuk ke form input type="date"
            document.getElementById('w_tglLahir').value = w.tanggalLahir ? new Date(w.tanggalLahir).toISOString().split('T')[0] : '';
            document.getElementById('w_pekerjaan').value = w.pekerjaan || '';
            document.getElementById('w_status').value = w.statusKeluarga;
            document.getElementById('w_tinggal').value = w.statusTinggal;
            document.getElementById('w_hp').value = w.noHp || '';
            
            document.getElementById('modal-warga-title').innerHTML = '<i class="fas fa-user-edit text-blue-500 mr-2"></i>Edit Data Warga';
            document.getElementById('btn-save-warga').innerHTML = "Simpan Perubahan";
            
            document.getElementById('modal-warga').classList.remove('hidden');
        }

        async function submitWarga(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-warga');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Menyimpan...'; btn.disabled = true;

            const id = document.getElementById('w_id').value;
            const payload = {
                noKk: document.getElementById('w_kk').value,
                nik: document.getElementById('w_nik').value,
                namaLengkap: document.getElementById('w_nama').value,
                noRumah: document.getElementById('w_rumah').value,
                jenisKelamin: document.getElementById('w_jk').value,
                tempatLahir: document.getElementById('w_tempatLahir').value,
                tanggalLahir: document.getElementById('w_tglLahir').value,
                agama: "Islam", // Default
                pekerjaan: document.getElementById('w_pekerjaan').value,
                statusKeluarga: document.getElementById('w_status').value,
                statusTinggal: document.getElementById('w_tinggal').value,
                noHp: document.getElementById('w_hp').value
            };

            const actionName = id ? 'updateWarga' : 'addWarga';
            const reqPayload = id ? { id: id, data: payload } : { data: payload };

            const res = await fetchApp(actionName, reqPayload);
            if (res.success) { 
                showToast(id ? "Data Warga berhasil diperbarui!" : "Data Warga berhasil disimpan!"); 
                loadMenu('warga'); 
            } else { 
                showToast(res.message, 'error'); 
                btn.innerHTML = originalText; 
                btn.disabled = false; 
            }
        }

        function renderCharts() {
            Chart.defaults.font.family = 'Inter';
            Chart.defaults.color = '#64748b';
            
            const dd = window.demographicsData;
            
            // 1. Grafik Usia Berkelompok L/P
            const ctxUsia = document.getElementById('chartUsia').getContext('2d');
            chartInstances.usia = new Chart(ctxUsia, {
                type: 'bar',
                data: {
                    labels: ['Balita (0-5)', 'Anak (6-11)', 'Remaja (12-25)', 'Dewasa (26-55)', 'Lansia (>55)'],
                    datasets: [
                        { label: 'Laki-laki', data: [dd.balitaL, dd.anakL, dd.remajaL, dd.dewasaL, dd.lansiaL], backgroundColor: '#3b82f6', borderRadius: 4 },
                        { label: 'Perempuan', data: [dd.balitaP, dd.anakP, dd.remajaP, dd.dewasaP, dd.lansiaP], backgroundColor: '#ec4899', borderRadius: 4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, grid: { borderDash: [2,4] } }, x: { grid: { display: false } } } }

            // 2. Grafik Pekerjaan
            const pk = window.pekerjaanData;
            const labelsPk = Object.keys(pk).length > 0 ? Object.keys(pk) : ['Belum Ada Data'];
            const dataPk = Object.keys(pk).length > 0 ? Object.values(pk) : [1];
            
            const ctxKerja = document.getElementById('chartKerja').getContext('2d');
            chartInstances.kerja = new Chart(ctxKerja, {
                type: 'bar',
                data: {
                    labels: labelsPk,
                    datasets: [{ label: 'Jumlah', data: dataPk, backgroundColor: '#10b981', borderRadius: 4 }]
                },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { borderDash: [2,4] } }, y: { grid: { display: false } } } }
            });

            // 3. Grafik Menikah (Dummy Fixes from image)
            const ctxNikah = document.getElementById('chartNikah').getContext('2d');
            chartInstances.nikah = new Chart(ctxNikah, {

        // Membuka modal rincian dari tabel
        function viewDetailPeminjam(noRumah) {
            // Ambil data spesifik warga ini dari variabel global
            const rawData = window.pinjamanDataGlobal.filter(p => p.noRumah === noRumah);
            const nama = rawData[0].namaPeminjam;
            
            let tPinjam = 0, tAngsur = 0;
            let tbodyHtml = '';

            rawData.reverse().forEach(p => {
                const val = Number(p.nominal);
                if(p.jenis === 'Pinjaman') tPinjam += val; else tAngsur += val;
                
                tbodyHtml += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 align-top whitespace-nowrap">
                            <div class="text-xs font-bold text-gray-800">${p.tanggal}</div>
                            <span class="text-[9px] font-bold px-2 py-0.5 rounded-md ${p.jenis === 'Pinjaman' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'} uppercase">${p.jenis}</span>

                        <td class="p-3 align-top">

                        <td class="p-3 text-right font-bold align-top whitespace-nowrap ${p.jenis === 'Pinjaman' ? 'text-rose-600' : 'text-emerald-600'}">

            document.getElementById('pj_nama').value = window.activePeminjam.nama;
            document.getElementById('pj_rumah').value = window.activePeminjam.noRumah;

            document.getElementById('pj_jenis').value = jenisTransaksi;

                title.innerHTML = '<i class="fas fa-hand-holding-usd text-emerald-500 mr-2"></i>Terima Angsuran';
                btnSave.className = "flex-1 px-5 py-2.5 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md transition";

                title.innerHTML = '<i class="fas fa-money-bill-wave text-rose-500 mr-2"></i>Beri Pinjaman Tambahan';

        async function submitPinjaman(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-pinjaman');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;

            const payload = {
                tanggal: document.getElementById('pj_tanggal').value,
                namaPeminjam: document.getElementById('pj_nama').value,
                noRumah: document.getElementById('pj_rumah').value,
                jenis: document.getElementById('pj_jenis').value,
                nominal: document.getElementById('pj_nominal').value,
                keterangan: document.getElementById('pj_ket').value
            };

            const res = await fetchApp('addPinjaman', { data: payload });
            if (res.success) { showToast("Transaksi dicatat", 'success'); loadMenu('pinjaman'); }
            else { showToast(res.message, 'error'); btn.innerHTML = 'Simpan Transaksi'; btn.disabled = false; }
        }

            const newUsername = document.getElementById('set_username').value;
            const newPassword = document.getElementById('set_password').value;

            const res = await fetchApp('updateProfile', { id: currentUser.id, username: newUsername, password: newPassword });
            
            if (res.success) {
                showToast("Profil berhasil diperbarui!");
                if(newPassword) {
                    setTimeout(() => {
                        showToast("Silakan login kembali dengan password baru.", "info");
                        logout();
                    }, 1500);
                } else {
                    loadMenu('setting');
                }
            } else {
                showToast(res.message, 'error');
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> Simpan Perubahan';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
